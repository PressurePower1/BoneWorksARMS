name: Build HexaBack Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: List libs
        run: ls libs/

      - name: Build mod
        run: dotnet build HexaBack.csproj -c Release

      - name: Find DLL
        run: find . -name "*.dll" -path "*/Release/*"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: HexaBack
          path: "**/bin/Release/**/*.dll"
          if-no-files-found: error
